<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 140" width="100%" height="100%">
  <defs>
    <style>
      .ks-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 600; fill: #FFFFFF; }
      .ks-main { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 0.5px; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- KSUM Diamond Lattice Icon -->
  <g transform="translate(20, 15) scale(1.1)" fill="#FFFFFF">
    <!-- 3 Parallel Diagonal Bars -->
    <rect x="42" y="10" width="48" height="10" rx="2" transform="rotate(-45 42 10)" />
    <rect x="30" y="22" width="48" height="10" rx="2" transform="rotate(-45 30 22)" />
    <rect x="18" y="34" width="48" height="10" rx="2" transform="rotate(-45 18 34)" />

    <!-- Matrix Dot Grid around bars -->
    <!-- Top-Right dots -->
    <rect x="68" y="12" width="6" height="6" rx="1" />
    <rect x="78" y="22" width="6" height="6" rx="1" />
    <rect x="88" y="32" width="6" height="6" rx="1" />
    <rect x="68" y="32" width="6" height="6" rx="1" />
    <rect x="78" y="42" width="6" height="6" rx="1" />
    <rect x="88" y="52" width="6" height="6" rx="1" />
    <rect x="58" y="42" width="6" height="6" rx="1" />
    <rect x="68" y="52" width="6" height="6" rx="1" />
    <rect x="78" y="62" width="6" height="6" rx="1" />

    <!-- Bottom-Left dots -->
    <rect x="8" y="52" width="6" height="6" rx="1" />
    <rect x="18" y="62" width="6" height="6" rx="1" />
    <rect x="28" y="72" width="6" height="6" rx="1" />
    <rect x="18" y="42" width="6" height="6" rx="1" />
    <rect x="28" y="52" width="6" height="6" rx="1" />
    <rect x="38" y="62" width="6" height="6" rx="1" />
    <rect x="28" y="32" width="6" height="6" rx="1" />
    <rect x="38" y="42" width="6" height="6" rx="1" />
    <rect x="48" y="52" width="6" height="6" rx="1" />
  </g>

  <!-- KSUM Text Block -->
  <text x="145" y="36" class="ks-sub">Kerala Startup Mission</text>
  <text x="145" y="64" class="ks-main">INNOVATION AND</text>
  <text x="145" y="90" class="ks-main">ENTREPRENEURSHIP</text>
  <text x="145" y="116" class="ks-main">DEVELOPMENT CENTRE</text>
</svg>
