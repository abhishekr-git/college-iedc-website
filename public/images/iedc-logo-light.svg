<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <defs>
    <style>
      .logo-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
    </style>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <!-- Lightbulb Base & Rays -->
  <g stroke="#F8FAFC" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rays -->
    <line x1="75" y1="18" x2="75" y2="30" />
    <line x1="38" y1="32" x2="47" y2="41" />
    <line x1="18" y1="68" x2="30" y2="72" />
    <line x1="112" y1="32" x2="103" y2="41" />
    <line x1="132" y1="68" x2="120" y2="72" />

    <!-- Bulb Body -->
    <path d="M 46 102 C 30 84 30 56 48 38 C 66 22 94 22 108 40 C 118 54 116 78 105 96 C 98 108 96 116 96 124 L 54 124 C 54 116 52 108 46 102 Z" />

    <!-- Screw Base -->
    <line x1="57" y1="132" x2="93" y2="132" />
    <line x1="60" y1="140" x2="90" y2="140" />
    <path d="M 65 148 C 70 153 80 153 85 148" />
  </g>

  <!-- Dashed Trajectory & Paper Plane Arrow -->
  <g fill="#F8FAFC">
    <path d="M 38 115 C 50 105 75 80 102 65" stroke="#F8FAFC" stroke-width="2.5" stroke-dasharray="4 4" fill="none" />
    <!-- Paper Plane Arrow -->
    <path d="M 90 52 L 148 38 L 124 90 L 112 70 Z" fill="#38BDF8" />
  </g>

  <!-- Text: IEDC CEKnpy -->
  <text x="160" y="105" class="logo-text" font-size="42" fill="#FFFFFF" letter-spacing="-1">IEDC <tspan fill="url(#textGrad)">CEKnpy</tspan></text>

  <!-- Swoosh & Star Sparkle -->
  <g fill="#38BDF8">
    <path d="M 300 140 C 360 140 420 118 440 82 C 400 110 350 128 300 132 Z" />
    <path d="M 425 60 Q 425 52 432 52 Q 425 52 425 44 Q 425 52 418 52 Q 425 52 425 60 Z" fill="#F8FAFC" />
  </g>
</svg>
